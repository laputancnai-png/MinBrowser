<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <link rel="stylesheet" href="bookmark-popup.css" />
  </head>
  <body>
    <form class="card" id="form">
      <h3 id="heading">已收藏</h3>
      <label for="title">名称</label>
      <input id="title" type="text" autocomplete="off" spellcheck="false" />
      <label for="url" class="link-only">网址</label>
      <input id="url" class="link-only" type="text" autocomplete="off" spellcheck="false" />
      <label for="folder" id="folder-label">文件夹</label>
      <select id="folder"></select>
      <label for="desc" class="link-only">描述</label>
      <input id="desc" class="link-only" type="text" autocomplete="off" placeholder="一句话说明（可选）" />
      <div class="buttons">
        <button type="button" id="remove" class="quiet">移除</button>
        <span class="grow"></span>
        <button type="button" id="manage">管理收藏夹…</button>
        <button type="submit" id="done" class="primary">完成</button>
      </div>
    </form>
    <script src="bookmark-popup.js"></script>
  </body>
</html>
