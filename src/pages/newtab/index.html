<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; img-src 'self'; form-action https://duckduckgo.com"
    />
    <title>新标签页</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main>
      <img class="logo" src="icon.png" alt="" width="96" height="96" />
      <h1>Min<span>Browser</span></h1>
      <form action="https://duckduckgo.com/" method="get">
        <input name="q" type="search" placeholder="用 DuckDuckGo 搜索" autocomplete="off" autofocus />
      </form>
      <p>不收集任何数据 · 你的记录只保存在你自己的电脑上</p>
      <p class="version">MinBrowser {{VERSION}}</p>
    </main>
  </body>
</html>
